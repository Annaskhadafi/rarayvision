version: "3.9"

services:
  backend:
    build: .
    container_name: rarayvision-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENV: production
      DATABASE_URL: postgresql://face:Wusthochq2018-@31.97.187.38:5556/face
      SECRET_KEY: rarayvision-secret-key-2026-chitraparatama-prod
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      ALLOWED_ORIGINS: https://vision.chitrapratama.com,https://vision.chitraparatama.com,http://localhost:3800
      RARAY_VISION_EMAIL: mochamad.khadafi@chitraparatama.co.id
      RARAY_VISION_PASSWORD: Wusthochq2018-
      RARAY_VISION_BASE_URL: https://vision.chitrapratama.com
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.6-27b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: nvidia/nemotron-nano-12b-v2-vl:free
      LLM_PROVIDER: groq
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      RERANKER_MODEL: ${RERANKER_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}
      REDIS_URL: ${REDIS_URL}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - uploads_data:/app/backend/uploads
      - models_data:/app/backend/ml_models
      - fastembed_cache:/root/.local/share/fastembed
      - hf_cache:/root/.cache/huggingface
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  frontend:
    build: ./frontend
    container_name: rarayvision-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3800:80"

volumes:
  uploads_data:
  models_data:
  fastembed_cache:
  hf_cache:
