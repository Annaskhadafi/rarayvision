version: "3.9"

services:
  backend:
    build: .
    container_name: rarayvision-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set}
      RARAY_VISION_EMAIL: ${RARAY_VISION_EMAIL:?RARAY_VISION_EMAIL must be set}
      RARAY_VISION_PASSWORD: ${RARAY_VISION_PASSWORD:?RARAY_VISION_PASSWORD must be set}
      RARAY_VISION_BASE_URL: ${RARAY_VISION_BASE_URL:?RARAY_VISION_BASE_URL must be set}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.6-27b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-nano-12b-v2-vl:free}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://9router.chitraparatama.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-cx/gpt-5.6-luna}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      RERANKER_MODEL: ${RERANKER_MODEL:-jinaai/jina-reranker-v1-tiny-en}
      REDIS_URL: ${REDIS_URL}
      HF_HOME: /app/cache/huggingface
      FASTEMBED_CACHE_PATH: /app/cache/fastembed
      TORCH_HOME: /app/cache/torch
    volumes:
      - /mnt/data/rarayvision/uploads:/app/backend/uploads
      - /mnt/data/rarayvision/cache:/app/cache
      - models_data:/app/backend/ml_models
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  frontend:
    build: ./frontend
    container_name: rarayvision-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3800:80"

volumes:
  models_data:
