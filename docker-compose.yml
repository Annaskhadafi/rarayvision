version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: rarayvision-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rarayvision}
      POSTGRES_USER: ${POSTGRES_USER:-raray}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yourpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raray} -d ${POSTGRES_DB:-rarayvision}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rarayvision-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://raray:yourpassword@db:5432/rarayvision}
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/models:/app/backend/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rarayvision-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

volumes:
  postgres_data:

