version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rarayvision}
      POSTGRES_USER: ${POSTGRES_USER:-raray}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ca66b066787710c9ecb21bf4777ce2d6}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raray} -d ${POSTGRES_DB:-rarayvision}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-raray}:${POSTGRES_PASSWORD:-ca66b066787710c9ecb21bf4777ce2d6}@db:5432/${POSTGRES_DB:-rarayvision}}
      - SECRET_KEY=${SECRET_KEY:-af8ab971bf9210d90d5b615f4e5359594707750d582e8d824a973e329726ee42}
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/models:/app/backend/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres_data:



