version: "3.9"

services:
  backend:
    build: .
    container_name: rarayvision-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENV: production
      DATABASE_URL: postgresql://face:Wusthochq2018-@31.97.187.38:5556/face
      SECRET_KEY: rarayvision-secret-key-2026-chitraparatama-prod
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      ALLOWED_ORIGINS: https://vision.chitrapratama.com,https://vision.chitraparatama.com,http://localhost:3800
      RARAY_VISION_EMAIL: mochamad.khadafi@chitraparatama.co.id
      RARAY_VISION_PASSWORD: Wusthochq2018-
      RARAY_VISION_BASE_URL: https://vision.chitrapratama.com
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: nvidia/nemotron-nano-12b-v2-vl:free
      LLM_PROVIDER: openrouter
    volumes:
      - uploads_data:/app/backend/uploads
      - models_data:/app/backend/ml_models
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  tire-counter:
    build:
      context: .
      dockerfile: ./warehouse-tire-counter/Dockerfile
    container_name: rarayvision-tire-counter
    restart: unless-stopped
    volumes:
      - tire_cache:/tmp/raray_media_cache
      - tire_uploads:/app/warehouse-tire-counter/uploads
      - tire_samples:/app/warehouse-tire-counter/samples
    expose:
      - "8001"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/telemetry"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build: ./frontend
    container_name: rarayvision-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - tire-counter
    ports:
      - "3800:80"

volumes:
  uploads_data:
  models_data:
  tire_cache:
  tire_uploads:
  tire_samples:
